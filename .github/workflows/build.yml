# Every push/PR: the app must compile. Every v* tag: build the engine kit and the .dmg on a clean
# Apple silicon runner and attach them to a draft release (publish it by hand after testing, see docs/RELEASING.md).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["site/**", "**.md"]
  pull_request:
    paths-ignore: ["site/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile the app (same flags as scripts/build-app.sh)
        run: swiftc -O -swift-version 5 -parse-as-library -target arm64-apple-macos14 app/main.swift -o /tmp/MacX
      - name: Check the Python backend
        run: python3 -m py_compile app/macxctl.py app/macxinstall.py engine/bridge/*.py
      - name: Check shell scripts
        run: for f in scripts/*.sh; do bash -n "$f"; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "Tag $GITHUB_REF_NAME != VERSION $(cat VERSION)"; exit 1; }
      - name: Toolchain (Rosetta, bison, zig)
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true
          brew install bison
          python3 -m pip install --break-system-packages ziglang
      - name: Build engine kit (patched Wine 11 libraries + bridge DLLs)
        run: scripts/build-engine-kit.sh
      - name: Build app and dmg
        run: scripts/build-app.sh --dmg
      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "MacX-$(cat ../VERSION).dmg" | tee "MacX-$(cat ../VERSION).dmg.sha256"
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat VERSION)"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --title "MacX $V" \
              --notes "SHA-256 \`MacX-$V.dmg\`: \`$(cut -d' ' -f1 dist/MacX-$V.dmg.sha256)\`"
          gh release upload "$GITHUB_REF_NAME" "dist/MacX-$V.dmg" "dist/MacX-$V.dmg.sha256" --clobber
